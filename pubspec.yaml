name: admin
description: Gym Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0

  provider: ^6.1.2
  go_router: ^14.6.2

  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.3

  intl: ^0.19.0
  url_launcher: ^6.3.1
  fl_chart: ^0.69.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  uuid: ^4.5.1

  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # - assets/icons/

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/images/splas_logo.png
  android_12:
    color: "#0A0A0A"
    image: assets/images/splas_logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/joji.png"
  adaptive_icon_background: "#4A8FD1"
  adaptive_icon_foreground: "assets/images/Joji Gym_foreground.png"
